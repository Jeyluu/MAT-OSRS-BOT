name: Deploy OSRS Helper to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh OSRS market snapshot
        run: npm run refresh:market -- --required
        env:
          OSRS_WIKI_USER_AGENT: OSRS-Helper-GitHub-Actions/1.0 (+${{ github.server_url }}/${{ github.repository }})

      - name: Check web formatting and types
        if: github.event_name != 'schedule'
        run: npm run check:web

      - name: Run web tests
        if: github.event_name != 'schedule'
        run: npm run test:web

      - name: Run existing bot tests
        if: github.event_name != 'schedule'
        run: npm test -- --runInBand

      - name: Build static site
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
